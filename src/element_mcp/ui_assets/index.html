<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="element-mcp-token" content="{{CSRF_TOKEN}}">
  <title>Element MCP</title>
  <script src="/ui/theme.js"></script>
  <link rel="stylesheet" href="/ui/styles.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand"><h1>Element MCP</h1><span class="runtime-status" id="server-state"><span class="status-dot" aria-hidden="true"></span><span id="server-state-label">Подключение…</span></span></div>
      <div class="header-tools">
        <button id="theme-action" class="icon-button" type="button" aria-label="Сменить цветовую схему" data-tooltip="Сменить цветовую схему"><svg class="icon theme-sun" aria-hidden="true"><use href="/ui/icons.svg#sun"></use></svg><svg class="icon theme-moon" aria-hidden="true"><use href="/ui/icons.svg#moon"></use></svg></button>
        <button id="restart-action" class="icon-button" type="button" aria-label="Перезапустить сервер" data-tooltip="Перезапустить сервер" aria-describedby="restart-message" disabled><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#restart"></use></svg></button>
        <p id="restart-message" class="sr-only" hidden></p>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar"><nav aria-label="Разделы настроек">
        <button type="button" data-page="connections" aria-current="page" aria-controls="page-connections"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#plug"></use></svg>Подключения</button>
        <button type="button" data-page="documentation" aria-controls="page-documentation"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#book"></use></svg>Документация</button>
        <button type="button" data-page="actions" aria-controls="page-actions"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#sliders"></use></svg>Действия агента</button>
        <button type="button" data-page="updates" aria-controls="page-updates"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#download"></use></svg>Обновления</button>
      </nav></aside>
      <main class="content">
        <section class="settings-page" id="page-connections" data-screen="connections" aria-labelledby="connections-title">
          <div class="page-heading"><h2 id="connections-title">Подключения</h2></div>
          <form id="console-settings" class="settings-group" novalidate>
            <div class="settings-heading"><h3>Панель управления</h3><label class="switch-label" for="console-enabled"><span id="console-summary">Загрузка…</span><input id="console-enabled" type="checkbox" role="switch" aria-label="Подключение к панели управления" disabled></label></div>
            <fieldset id="console-fields" disabled>
              <div class="field"><label for="console-server">Адрес Console</label><input id="console-server" type="url" maxlength="2048" autocomplete="url" spellcheck="false" placeholder="https://element.example/console" aria-describedby="console-error"></div>
              <div class="field"><label for="console-client-id">Client ID</label><input id="console-client-id" type="text" maxlength="2048" autocomplete="username" spellcheck="false" aria-describedby="console-error"></div>
              <div class="field"><label for="console-client-secret">Client Secret</label><div class="password-field"><input id="console-client-secret" type="password" maxlength="8192" autocomplete="new-password" spellcheck="false" aria-describedby="console-secret-help console-error"><button id="secret-visibility" class="icon-button" type="button" aria-label="Показать Client Secret" data-tooltip="Показать Client Secret"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#eye"></use></svg></button></div><p id="console-secret-help" class="field-note" hidden></p></div>
            </fieldset>
            <p id="console-feedback" class="sr-only" hidden></p><p id="console-error" class="sr-only" hidden></p>
            <div class="form-actions"><button id="console-save" class="button primary" type="submit" disabled>Проверить и сохранить</button></div>
          </form>
          <form id="runtime-settings" class="settings-group" novalidate>
            <div class="settings-heading"><h3>Сервер Element</h3><span id="runtime-summary" class="summary">Загрузка…</span></div>
            <div class="field"><label for="runtime-instance-root">Каталог экземпляра</label><input id="runtime-instance-root" type="text" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="C:\Element\server-instance" aria-describedby="runtime-error" disabled></div>
            <p id="runtime-manager-status" class="field-note"></p>
            <p id="runtime-feedback" class="sr-only" hidden></p><p id="runtime-error" class="sr-only" hidden></p>
            <div class="form-actions"><button id="runtime-save" class="button" type="submit" disabled>Сохранить</button></div>
          </form>
        </section>
        <section class="settings-page" id="page-documentation" data-screen="documentation" aria-labelledby="documentation-title" hidden>
          <div class="page-heading"><h2 id="documentation-title">Документация</h2><span id="documentation-summary" class="summary">Загрузка…</span></div>
          <form id="documentation-settings" novalidate>
            <div class="field"><label for="documentation-path">Каталог документации</label><input id="documentation-path" type="text" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="C:\Element\documentation" aria-describedby="documentation-help documentation-error" disabled><p id="documentation-help" class="field-note" hidden></p></div>
            <p id="documentation-feedback" class="sr-only" hidden></p><p id="documentation-error" class="sr-only" hidden></p>
            <div class="form-actions"><button id="documentation-activate" class="button primary" type="submit" disabled>Проверить и подключить</button></div>
          </form>
          <dl id="documentation-counts" class="details" hidden><div><dt>Документы</dt><dd id="documentation-documents"></dd></div><div><dt>Фрагменты</dt><dd id="documentation-chunks"></dd></div></dl>
        </section>
        <section class="settings-page" id="page-actions" data-screen="actions" aria-labelledby="actions-title" hidden>
          <form id="actions-settings" novalidate>
            <div class="page-heading"><h2 id="actions-title">Действия агента</h2><label class="switch-label" for="actions-enabled"><span id="actions-summary">Загрузка…</span><input id="actions-enabled" type="checkbox" role="switch" aria-label="Разрешить действия агента" disabled></label></div>
            <fieldset id="actions-fields" disabled>
              <fieldset class="action-selection"><legend class="sr-only">Доступные операции</legend>
                <label class="check-label" for="action-upload"><input id="action-upload" type="checkbox" value="upload_project_assembly"><span>Загрузка сборки</span></label>
                <label class="check-label" for="action-update"><input id="action-update" type="checkbox" value="update_application"><span>Обновление приложения</span></label>
                <label class="check-label" for="action-start"><input id="action-start" type="checkbox" value="start_application"><span>Запуск приложения</span></label>
                <label class="check-label" for="action-stop"><input id="action-stop" type="checkbox" value="stop_application"><span>Остановка приложения</span></label>
              </fieldset>
              <div class="field"><label for="actions-upload-roots">Каталоги сборок</label><textarea id="actions-upload-roots" rows="3" maxlength="12288" autocomplete="off" spellcheck="false" placeholder="C:\Element\builds" aria-describedby="actions-error"></textarea></div>
            </fieldset>
            <p id="actions-feedback" class="sr-only" hidden></p><p id="actions-error" class="sr-only" hidden></p>
            <div class="form-actions"><button id="actions-save" class="button primary" type="submit" disabled>Сохранить</button></div>
          </form>
        </section>
        <section class="settings-page" id="page-updates" data-screen="updates" aria-labelledby="updates-title" hidden>
          <div class="page-heading"><h2 id="updates-title">Обновления</h2></div>
          <dl class="details"><div><dt>Текущая версия</dt><dd id="server-version">—</dd></div><div><dt>Последняя версия</dt><dd id="latest-version">Не проверена</dd></div></dl>
          <h3 id="update-title" class="sr-only"></h3><p id="update-message" class="sr-only"></p>
          <div class="form-actions"><button id="update-action" class="button" type="button" disabled><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#refresh"></use></svg><span class="button-label">Проверяем…</span></button></div>
          <form id="source-settings" class="settings-group source-settings" novalidate>
            <h3>Источник обновлений</h3>
            <div class="source-modes" aria-label="Источник обновлений"><button id="source-use-origin" type="button" aria-pressed="true">Удалённый origin</button><button id="source-use-local" type="button" aria-pressed="false">Локальный Git</button></div>
            <div id="source-remote-field" class="field"><span class="field-label">Репозиторий</span><span id="update-source" class="source-value">—</span></div>
            <div id="source-local-field" class="field" hidden><label for="source-path">Каталог репозитория</label><input id="source-path" type="text" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="C:\Projects\1c-element-mcp" aria-describedby="source-error"></div>
            <p id="source-feedback" class="sr-only" hidden></p><p id="source-error" class="sr-only" hidden></p>
            <div class="form-actions" id="source-save-area" hidden><button id="source-save" class="button primary" type="submit">Сохранить и проверить</button></div>
          </form>
        </section>
      </main>
    </div>
    <footer><span id="endpoint">/mcp</span><span id="footer-version">Element MCP</span></footer>
  </div>
  <div id="toasts" class="toasts" aria-label="Уведомления"></div>
  <template id="toast-template"><div class="toast" data-kind="success"><svg class="icon toast-success" aria-hidden="true"><use href="/ui/icons.svg#check"></use></svg><svg class="icon toast-error" aria-hidden="true"><use href="/ui/icons.svg#error"></use></svg><p class="toast-message" aria-atomic="true"></p><button class="icon-button toast-close" type="button" aria-label="Закрыть уведомление"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#close"></use></svg></button></div></template>
</body>
</html>
