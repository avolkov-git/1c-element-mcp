[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "1c-element-mcp"
version = "0.4.0"
description = "MCP server for AI-assisted development with 1C:Enterprise.Element"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2",
  "numpy>=1.26,<3",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
element-mcp = "element_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"element_mcp.normalizer" = [
  "guide_sets/*/*.md",
  "guide_sets/*/docs-*/README.md",
  "guide_sets/*/docs-*/guides/*.md",
]
"element_mcp" = ["ui_assets/*.html", "ui_assets/*.css", "ui_assets/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
